<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#c8102e"><title>Masuk SIMANGNDA</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f3f5f8;font-family:Arial,sans-serif;color:#18212f}.card{width:min(92vw,390px);background:#fff;border-radius:22px;padding:26px;box-shadow:0 12px 40px #18212f18}.logo{background:#d9001b;color:#fff;border-radius:16px;padding:18px;text-align:center;font-weight:900;letter-spacing:1px;font-size:23px}h1{font-size:21px;margin:22px 0 6px}p{font-size:13px;color:#687385;line-height:1.5}input,button{width:100%;padding:14px;border-radius:12px;font-size:16px}input{border:1px solid #d7dee7;margin:10px 0}button{border:0;background:#d9001b;color:white;font-weight:800;margin-top:6px}#msg{color:#c8102e;min-height:20px;font-size:13px}</style></head><body><main class="card"><div class="logo">SIMANGNDA</div><h1>Masuk untuk Tim Sales</h1><p>Masukkan password tim untuk membuka simulasi angsuran Honda.</p><form id="f"><input id="pw" type="password" autocomplete="current-password" placeholder="Password tim" required><button type="submit">Masuk</button></form><div id="msg" role="status"></div></main><script>document.getElementById('f').addEventListener('submit',async e=>{e.preventDefault();const b=e.target.querySelector('button'),m=document.getElementById('msg');b.disabled=true;m.textContent='Memeriksa password…';try{const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:document.getElementById('pw').value})});if(r.ok){location.replace('/');}else{m.textContent='Password tidak sesuai. Coba lagi.';}}catch(_){m.textContent='Koneksi diperlukan untuk login pertama kali.';}finally{b.disabled=false;}});</script></body></html>
